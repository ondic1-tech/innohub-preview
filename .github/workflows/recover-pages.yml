name: Recover stuck Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
permissions:
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/deployments/8b0aaafd6c28ef4eace4b0a6ccb16b1382680422/cancel"
